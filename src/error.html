<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% - Kesalahan Sistem Internal | SIM-Lab FKG</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--primary: #2d5a43;
				--primary-hover: #234735;
				--bg-main: #f8f9fa;
				--text-main: #0f172a;
				--text-muted: #64748b;
				--border-color: #e2e8f0;
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				background-color: var(--bg-main);
				color: var(--text-main);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
			}
			.container {
				width: 100%;
				max-width: 480px;
				text-align: center;
			}
			.logo-badge {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 4.5rem;
				height: 4.5rem;
				background-color: #fef2f2;
				border: 1px solid #fecaca;
				border-radius: 1.25rem;
				margin-bottom: 1.25rem;
				color: #dc2626;
				box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
			}
			.logo-badge svg {
				width: 2.25rem;
				height: 2.25rem;
			}
			.status-code {
				font-size: 4.5rem;
				font-weight: 800;
				line-height: 1;
				letter-spacing: -0.025em;
				color: #0f172a;
				margin-bottom: 0.5rem;
			}
			.error-title {
				font-size: 1.5rem;
				font-weight: 700;
				color: #1e293b;
				margin-bottom: 0.5rem;
			}
			.error-card {
				background: #ffffff;
				border: 1px solid var(--border-color);
				border-radius: 1rem;
				padding: 1.25rem;
				text-align: left;
				margin-top: 1.5rem;
				margin-bottom: 1.5rem;
				box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
			}
			.card-header {
				font-size: 0.75rem;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: var(--text-muted);
				margin-bottom: 0.375rem;
			}
			.card-desc {
				font-size: 0.875rem;
				color: #475569;
				line-height: 1.5;
			}
			.error-box {
				margin-top: 0.75rem;
				padding: 0.625rem 0.75rem;
				background-color: #fff1f2;
				border-radius: 0.5rem;
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				font-size: 0.75rem;
				color: #e11d48;
				word-break: break-all;
			}
			.actions {
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
				justify-content: center;
			}
			@media (min-width: 640px) {
				.actions {
					flex-direction: row;
				}
			}
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				height: 2.625rem;
				padding: 0 1.25rem;
				border-radius: 0.75rem;
				font-size: 0.875rem;
				font-weight: 600;
				text-decoration: none;
				cursor: pointer;
				transition: all 0.15s ease-in-out;
				border: 1px solid transparent;
			}
			.btn-outline {
				background-color: #ffffff;
				border-color: var(--border-color);
				color: #334155;
			}
			.btn-outline:hover {
				background-color: #f1f5f9;
				color: #0f172a;
			}
			.btn-primary {
				background-color: var(--primary);
				color: #ffffff;
			}
			.btn-primary:hover {
				background-color: var(--primary-hover);
			}
			footer {
				margin-top: 2.5rem;
				font-size: 0.75rem;
				color: #94a3b8;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="logo-badge">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					fill="none"
					viewBox="0 0 24 24"
					stroke-width="2"
					stroke="currentColor"
				>
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
					/>
				</svg>
			</div>

			<div class="status-code">%sveltekit.status%</div>
			<h1 class="error-title">Kesalahan Sistem Internal</h1>

			<div class="error-card">
				<div class="card-header">Detail Error</div>
				<p class="card-desc">
					Maaf, terjadi kesalahan internal pada server kami. Halaman tidak dapat dimuat saat ini.
				</p>
				<div class="error-box">%sveltekit.error.message%</div>
			</div>

			<div class="actions">
				<button type="button" onclick="history.back()" class="btn btn-outline">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="16"
						height="16"
						fill="none"
						viewBox="0 0 24 24"
						stroke-width="2"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
						/>
					</svg>
					Kembali
				</button>
				<button type="button" onclick="location.reload()" class="btn btn-outline">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="16"
						height="16"
						fill="none"
						viewBox="0 0 24 24"
						stroke-width="2"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"
						/>
					</svg>
					Muat Ulang
				</button>
				<a href="/admin/dashboard" class="btn btn-primary">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="16"
						height="16"
						fill="none"
						viewBox="0 0 24 24"
						stroke-width="2"
						stroke="currentColor"
					>
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
						/>
					</svg>
					Dashboard
				</a>
			</div>

			<footer>
				<p>© 2026 Laboratorium Keterampilan Klinik FKG UNHAS</p>
			</footer>
		</div>
	</body>
</html>
